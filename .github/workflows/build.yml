name: Build

# Builds from a clean clone, so a reference that only resolves on one machine fails here.

# Actions are pinned to commit SHAs, not tags. A tag can be repointed at new code by
# whoever owns the action; a SHA cannot. The trailing comment is the version that SHA is,
# so to update one, look up the new release's commit and replace both.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2

      - name: Restore packages
        run: nuget restore MovieSelector.sln

      - name: Build (Release)
        run: msbuild MovieSelector.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MCS-release-build
          path: MovieSelector/bin/Release/
          retention-days: 7
