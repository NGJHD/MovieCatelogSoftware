name: Release

# Push a tag matching the AssemblyVersion in MovieSelector/Properties/AssemblyInfo.cs:
#   git tag v4.1.5 && git push origin v4.1.5

# Actions are pinned to commit SHAs, not tags. A tag can be repointed at new code by
# whoever owns the action; a SHA cannot. The trailing comment is the version that SHA is,
# so to update one, look up the new release's commit and replace both.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2

      - name: Restore packages
        run: nuget restore MovieSelector.sln

      - name: Build (Release)
        run: msbuild MovieSelector.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Check the tag matches AssemblyVersion
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $exe = Get-Item "MovieSelector/bin/Release/MCS.exe"
          $built = $exe.VersionInfo.FileVersion
          Write-Host "tag=$tag  built=$built"
          if (-not $built.StartsWith($tag)) {
            throw "Tag $tag does not match AssemblyVersion $built. Update Properties/AssemblyInfo.cs, or retag."
          }

      - name: Package
        shell: pwsh
        run: |
          # Ship only what the app needs to run - two files, nothing else.
          # MCS.pdb is debug symbols, Newtonsoft.Json.xml is IntelliSense documentation, and
          # MCS.exe.config carries no settings the app depends on. Database/, Posters/ and Log/
          # are user data the app creates for itself on first run.
          $files = @(
            "MovieSelector/bin/Release/MCS.exe",
            "MovieSelector/bin/Release/Newtonsoft.Json.dll"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing expected release file: $f" }
          }
          Compress-Archive -Path $files -DestinationPath "MCS-${{ github.ref_name }}.zip"
          Write-Host "Packaged:"
          Expand-Archive "MCS-${{ github.ref_name }}.zip" -DestinationPath "$env:TEMP\zipcheck" -Force
          Get-ChildItem "$env:TEMP\zipcheck" | Select-Object Name, Length | Format-Table

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: MCS-${{ github.ref_name }}.zip
          generate_release_notes: true
